name: Attested private Studio release upload (development only)
on:
  push:
    branches: [feature/ptg-private-pages-package-20261121]
    paths:
      - "site/**"
      - "staging/**"
      - "scripts/build-private-flyer.mjs"
      - ".github/workflows/private-release-upload.yml"
permissions:
  contents: read
  id-token: write
jobs:
  private-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Build private HTML entirely in disposable CI workspace
        run: |
          set -euo pipefail
          node staging/build-private-package.mjs "$RUNNER_TEMP/branchline-private-bundle"
          test -f "$RUNNER_TEMP/branchline-private-bundle/private/studio.html"
      - name: Install release uploader client only in disposable CI workspace
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock --ignore-scripts @supabase/supabase-js@2.49.8
      - name: Verify GitHub OIDC identity, private upload and object SHA-256
        run: node staging/private-release-upload.mjs
