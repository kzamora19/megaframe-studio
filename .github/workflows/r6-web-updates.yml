name: R6 production web update regression
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scope-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check studio/updates/check.js
      - run: node --test tests/r6-web-updates.test.cjs
