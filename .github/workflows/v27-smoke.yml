name: MegaFrame v2.7 roadmap completion regression
on:
  pull_request:
    paths:
      - editor.js
      - index.html
      - qa/smoke-v27.cjs
      - qa/smoke-exit-modal.cjs
      - qa/smoke-right-rail-reload.cjs
      - qa/smoke-mobile-panels.cjs
      - qa/smoke-modal-prompts.cjs
      - qa/smoke-v27-cloud.cjs
      - shared.js
      - db/v27_template_organization.sql
      - .github/workflows/v27-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roadmap-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate JavaScript
        run: |
          node --check editor.js
          node --check qa/smoke-v27.cjs
          node --check qa/smoke-exit-modal.cjs
          node --check qa/smoke-right-rail-reload.cjs
          node --check qa/smoke-mobile-panels.cjs
          node --check qa/smoke-modal-prompts.cjs
          node --check qa/smoke-v27-cloud.cjs
          node --check shared.js
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Test saved state, mobile handling and roadmap features
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 3
          node qa/smoke-v21.cjs
          node qa/smoke-v22.cjs
          node qa/smoke-v25.cjs
          node qa/smoke-v27.cjs
          node qa/smoke-v27-cloud.cjs
          node qa/smoke-exit-modal.cjs
          node qa/smoke-right-rail-reload.cjs
          node qa/smoke-mobile-panels.cjs
          node qa/smoke-modal-prompts.cjs
