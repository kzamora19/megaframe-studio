name: Staged MegaFrame private-package proof (not deployable)
on:
  pull_request:
    branches: [main]
    paths:
      - 'staging/**'
      - '.github/workflows/private-package-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-private-separation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify staged source/private and launcher/public separation
        run: |
          node --check staging/build-private-package.mjs
          node --test staging/private-package.test.mjs
