name: Staging MegaFrame private bundle digest (NO deployment)
on:
  push:
    branches: [feature/ptg-private-pages-package-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-bundle-digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Build private editor only under isolated temporary runner path
        run: node staging/build-private-package.mjs "$RUNNER_TEMP/megaframe-private"
      - name: Validate SHA-256 and record manifest (never upload editor)
        env:
          BUNDLE_DIR: ${{ runner.temp }}/megaframe-private
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync,appendFileSync} from "node:fs";
          import {createHash} from "node:crypto";
          import {join} from "node:path";
          const manifest=JSON.parse(readFileSync(join(process.env.BUNDLE_DIR,"manifest.json"),"utf8"));
          const bytes=readFileSync(join(process.env.BUNDLE_DIR,"private","studio.html"));
          const digest=createHash("sha256").update(bytes).digest("hex");
          if(manifest.sha256!==digest||manifest.bytes!==bytes.length)throw Error("Private hash/byte mismatch");
          const prefix="releases/"+digest.slice(0,16)+"/studio.html";
          console.log("Verified private staging digest "+digest+" bytes "+bytes.length+" target "+prefix);
          const summary=["### MegaFrame private editor staging digest",
            "SHA-256: "+digest, "Bytes: "+bytes.length,
            "Private storage object: "+prefix, "NOT uploaded or publicly deployed."].join("\n")+"\n";
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          NODE
