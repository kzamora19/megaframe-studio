name: Build, verify and publish MegaFrame to GitHub Pages

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'studio/**'
      - 'tests/r6-web-updates.test.cjs'
      - '*.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'scripts/build_pages_site.py'
      - 'qa/smoke-pages.cjs'
      - 'qa/smoke-previews.cjs'
      - 'qa/smoke-public-library-error.cjs'
      - 'qa/smoke-emoji-covers.cjs'
      - 'qa/smoke-saved-projects.cjs'
      - 'qa/smoke-startup-recovery.cjs'
      - 'qa/smoke-recovery-discard.cjs'
      - 'qa/smoke-startup-choice.cjs'
      - 'qa/smoke-new-project.cjs'
      - 'qa/smoke-exit-modal.cjs'
      - 'qa/smoke-right-rail-reload.cjs'
      - 'qa/smoke-mobile-panels.cjs'
      - 'qa/smoke-modal-prompts.cjs'
      - 'qa/smoke-overlays.cjs'
      - 'qa/smoke-multiple-overlays.cjs'
      - 'qa/smoke-overlays-device-review.cjs'
      - 'qa/smoke-font-picker.cjs'
      - 'qa/smoke-editable-slider-values.cjs'
      - 'qa/smoke-drive.cjs'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'studio/**'
      - 'tests/r6-web-updates.test.cjs'
      - '*.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'scripts/build_pages_site.py'
      - 'qa/smoke-pages.cjs'
      - 'qa/smoke-previews.cjs'
      - 'qa/smoke-public-library-error.cjs'
      - 'qa/smoke-emoji-covers.cjs'
      - 'qa/smoke-saved-projects.cjs'
      - 'qa/smoke-startup-recovery.cjs'
      - 'qa/smoke-recovery-discard.cjs'
      - 'qa/smoke-startup-choice.cjs'
      - 'qa/smoke-new-project.cjs'
      - 'qa/smoke-exit-modal.cjs'
      - 'qa/smoke-right-rail-reload.cjs'
      - 'qa/smoke-mobile-panels.cjs'
      - 'qa/smoke-modal-prompts.cjs'
      - 'qa/smoke-overlays.cjs'
      - 'qa/smoke-multiple-overlays.cjs'
      - 'qa/smoke-overlays-device-review.cjs'
      - 'qa/smoke-font-picker.cjs'
      - 'qa/smoke-editable-slider-values.cjs'
      - 'qa/smoke-drive.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: megaframe-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify JavaScript syntax
        run: |
          node --check editor.js
          node --check overlay-engine.js
          node --check shared.js
          node --check pwa-client.js
          node --test tests/r6-web-updates.test.cjs
          node --check service-worker.js
          node --check qa/smoke-pages.cjs
          node --check qa/smoke-previews.cjs
          node --check qa/smoke-public-library-error.cjs
          node --check qa/smoke-emoji-covers.cjs
          node --check qa/smoke-saved-projects.cjs
          node --check qa/smoke-startup-recovery.cjs
          node --check qa/smoke-recovery-discard.cjs
          node --check qa/smoke-startup-choice.cjs
          node --check qa/smoke-new-project.cjs
          node --check qa/smoke-exit-modal.cjs
          node --check qa/smoke-right-rail-reload.cjs
          node --check qa/smoke-mobile-panels.cjs
          node --check qa/smoke-modal-prompts.cjs
          node --check qa/smoke-overlays.cjs
          node --check qa/smoke-multiple-overlays.cjs
          node --check qa/smoke-overlays-device-review.cjs
          node --check qa/smoke-font-picker.cjs
          node --check qa/smoke-editable-slider-values.cjs
          node --check google-drive.js
          node --check google-drive-config.js
          node --check qa/smoke-drive.cjs
      - name: Build self-contained static artifact and local test paths
        run: |
          python3 scripts/build_pages_site.py _site
          mkdir -p _preview/megaframe-studio
          cp -a _site/. _preview/
          cp -a _site/. _preview/megaframe-studio/
      - name: Install browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          # GitHub's Ubuntu image includes Chromium runtime libraries; avoid slow apt provisioning.
          npx playwright install chromium --only-shell
      - name: Test editing, cloud permissions, touch UI and offline project path
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _preview >/tmp/megaframe-pages-test.log 2>&1 &
          sleep 3
          node qa/smoke-v21.cjs
          node qa/smoke-v22.cjs
          node qa/smoke-v25.cjs
          node qa/smoke-v26.cjs
          node qa/smoke-pages.cjs
          node qa/smoke-previews.cjs
          node qa/smoke-public-library-error.cjs
          node qa/smoke-emoji-covers.cjs
          node qa/smoke-saved-projects.cjs
          node qa/smoke-startup-recovery.cjs
          node qa/smoke-recovery-discard.cjs
          node qa/smoke-startup-choice.cjs
          node qa/smoke-new-project.cjs
          node qa/smoke-exit-modal.cjs
          node qa/smoke-right-rail-reload.cjs
          node qa/smoke-mobile-panels.cjs
          node qa/smoke-protected-mobile-layout.cjs
          node qa/smoke-modal-prompts.cjs
          node qa/smoke-overlays.cjs
          node qa/smoke-multiple-overlays.cjs
          node qa/smoke-overlays-device-review.cjs
          node qa/smoke-font-picker.cjs
          node qa/smoke-editable-slider-values.cjs
          node qa/smoke-drive.cjs

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable/configure GitHub Pages for this repository
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: python3 scripts/build_pages_site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        name: Publish app to GitHub Pages
        uses: actions/deploy-pages@v4
