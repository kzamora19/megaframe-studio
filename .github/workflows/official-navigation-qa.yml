name: MegaFrame official Branchline navigation screenshots (NO DEPLOY)
on:
  push:
    branches: [feature/official-navigation-protected-20261123]
    paths:
      - 'staging/studio-access/**'
      - 'staging/build-cutover-pages.mjs'
      - 'staging/official-navigation-browser.test.mjs'
      - '.github/workflows/official-navigation-qa.yml'
  pull_request:
    paths:
      - 'staging/studio-access/**'
      - 'staging/build-cutover-pages.mjs'
      - 'staging/official-navigation-browser.test.mjs'
      - '.github/workflows/official-navigation-qa.yml'
permissions:
  contents: read
jobs:
  staged-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check editor-free protected staging source
        run: |
          node --check staging/build-cutover-pages.mjs
          node --check staging/studio-access/unified-navigation.js
          PTG_STUDIO_CUTOVER_PREVIEW=1 node staging/build-cutover-pages.mjs staging/.official-nav-preview
          node --test staging/cutover-pages.test.mjs
      - name: Install Chromium for screenshot and navigation regression
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Verify logo app control, gated paths, Escape, and 390px layout
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory staging/.official-nav-preview >/tmp/megaframe-official.log 2>&1 &
          node staging/official-navigation-browser.test.mjs frame
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: megaframe-official-navigation-screenshots
          path: artifacts/official-navigation/*.png
          retention-days: 14
          if-no-files-found: warn
